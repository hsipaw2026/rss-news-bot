name: 缅甸新闻推送 (金凤凰+缅华网)

on:
  schedule:
    - cron: '30 1 * * *'  # 每天缅甸时间早上8:30推送
  workflow_dispatch:

jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - name: 获取并发送新闻
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
            # 1. 获取《金凤凰》报的新闻 (从 https://mmgpmedia.com)
            GOLDEN_PHOENIX=$(curl -s "https://mmgpmedia.com" | grep -oE '<a[^>]+href="[^"]*"[^>]*>[^<]*</a>' | grep -E '要闻|热点|财经' | grep -v 'href="/"' | head -6 | sed 's/<a[^>]*href="\([^"]*\)"[^>]*>\([^<]*\)<\/a>/🔸 [\2](\1)/' | sed 's/^/  /')
            # 如果没有抓取到具体新闻，则显示提示
            if [ -z "$GOLDEN_PHOENIX" ]; then
              GOLDEN_PHOENIX="  🔸 今日暂无热点新闻"
            fi

            # 2. 获取缅华网的官方新闻链接 (从 https://www.mhwmm.com)
            # 注意：此处需要一条示例新闻链接，用于适配你的实际需求
            MHWMM_NEWS_LINKS=$(curl -s "https://www.mhwmm.com" | grep -oE 'href="(/ch/[^"]+\.html)"' | head -5 | sed 's/href="/https:\/\/www.mhwmm.com/')
            MHWMM_NEWS=""
            if [ -n "$MHWMM_NEWS_LINKS" ]; then
              MHWMM_NEWS="  🔹 [点击查看缅华网最新资讯]($(echo "$MHWMM_NEWS_LINKS" | head -1))"
            else
              MHWMM_NEWS="  🔹 今日暂无更新"
            fi

            # 3. 组装最终消息
            FINAL_MESSAGE="📰 *缅甸每日新闻简报* %0A%0A"
            FINAL_MESSAGE="${FINAL_MESSAGE}*🔸 《金凤凰》报*%0A${GOLDEN_PHOENIX}%0A%0A"
            FINAL_MESSAGE="${FINAL_MESSAGE}*🔹 缅华网*%0A${MHWMM_NEWS}%0A%0A"
            FINAL_MESSAGE="${FINAL_MESSAGE}📅 $(date '+%Y-%m-%d') | 由您的专属机器人推送"

            # 4. 发送到 Telegram
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
                -d "chat_id=${CHAT_ID}" \
                -d "text=${FINAL_MESSAGE}" \
                -d "parse_mode=Markdown" \
                -d "disable_web_page_preview=true"
