name: 缅甸新闻推送 (稳定版)

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - name: 获取并发送新闻
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
            # 1. 获取《金凤凰》报的新闻 (修正版)
            GOLDEN_PHOENIX=$(curl -s "https://mmgpmedia.com" | grep -oE '<a[^>]+href="[^"]*"[^>]*>[^<]+</a>' | grep -v 'href="/"' | head -6 | sed 's/<a[^>]*href="\([^"]*\)"[^>]*>\([^<]*\)<\/a>/🔸 [\2](\1)/')
            if [ -z "$GOLDEN_PHOENIX" ]; then
              GOLDEN_PHOENIX="  🔸 今日暂无热点新闻"
            fi

            # 2. 获取缅华网的新闻 (根据你提供的链接格式修正)
            MHWMM_NEWS=$(curl -s "https://www.mhwmm.com" | grep -oE '<a href="/miandianxinwen/[0-9]+\.html"[^>]*>[^<]+</a>' | head -5 | sed 's/<a href="\([^"]*\)"[^>]*>\([^<]*\)<\/a>/🔹 [\2](https:\/\/www.mhwmm.com\1)/')

            if [ -z "$MHWMM_NEWS" ]; then
              MHWMM_NEWS="  🔹 今日暂无更新"
            fi

            # 3. 组装消息
            FINAL_MESSAGE="📰 *缅甸每日新闻简报* %0A%0A"
            FINAL_MESSAGE="${FINAL_MESSAGE}*🔸 《金凤凰》报*%0A${GOLDEN_PHOENIX}%0A%0A"
            FINAL_MESSAGE="${FINAL_MESSAGE}*🔹 缅华网*%0A${MHWMM_NEWS}%0A%0A"
            FINAL_MESSAGE="${FINAL_MESSAGE}📅 $(date '+%Y-%m-%d') | 由您的专属机器人推送"

            # 发送消息时增加一个参数，让链接更干净
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
                -d "chat_id=${CHAT_ID}" \
                -d "text=${FINAL_MESSAGE}" \
                -d "parse_mode=Markdown" \
                -d "disable_web_page_preview=false"
